<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch & Earn Mini App</title>

  <!-- Telegram WebApp Official Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK Script Tag -->
  <script src="//libtl.com/sdk.js" data-zone="11879768" data-sdk="show_11879768"></script>

  <style>
    body {
      background-color: #1c1c1e;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #2c2c2e;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      width: 80%;
      max-width: 300px;
    }
    .btn {
      background-color: #34c759;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📺 Watch & Earn</h2>
    <p>Complete the video ad to receive your reward.</p>
    <button class="btn" onclick="playAd()">Watch Ad</button>
  </div>

  <script>
    Telegram.WebApp.ready();

    function playAd() {
      if (typeof show_11879768 === 'function') {
        show_11879768().then(() => {
          Telegram.WebApp.showAlert("✅ Ad Finished! Reward added.");
          Telegram.WebApp.sendData(JSON.stringify({ status: "success", amount: 0.20 }));
        }).catch((err) => {
          Telegram.WebApp.showAlert("❌ Ad not completed. Please try again.");
        });
      } else {
        Telegram.WebApp.showAlert("⏳ Ads are loading... Please wait 5 seconds.");
      }
    }
  </script>

</body>
</html>
